[project]
name = "qa-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "komal-adimulam", email = "komal.adimulam@fissionlabs.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "fpdf2>=2.9.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.8.1",
    "langchain-openai>=1.8.0",
    "numpy>=2.5.5",
    "openai>=3.52.0",
    "pydantic>=2.14.3",
    "pypdf>=7.1.0",
    "pytest>=9.2.0",
    "python-multipart>=0.0.34",
    "sentence-transformers>=6.3.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
qa-project = "qa_project:main"
app = "qa_project.run:main"
all = "qa_project.run_all:main"
run-app = "qa_project.run:main"
run-all = "qa_project.run_all:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
