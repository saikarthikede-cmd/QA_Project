[project]
name = "qa-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "komal-adimulam", email = "komal.adimulam@fissionlabs.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "fpdf2==2.8.3",
    "httpx==0.28.1",
    "langchain-core==0.3.72",
    "langchain-openai==0.3.28",
    "numpy==1.26.4",
    "openai>=1.50.0",
    "pydantic==2.10.3",
    "pypdf==4.3.1",
    "pytest==8.3.4",
    "python-multipart==0.0.12",
    "sentence-transformers==2.7.0",
    "uvicorn[standard]==0.32.1",
]

[project.scripts]
qa-project = "qa_project:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
